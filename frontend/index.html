<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TikFast Selfhost</title>

    <link
        rel="stylesheet"
        href="./css/styles.css">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#111827">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TikFast">

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

</head>

<body>

    <main class="container">

        <header class="hero">

            <h1>TikFast Selfhost</h1>

            <p>
                Private self-hosted media downloader powered by yt-dlp.
            </p>

        </header>

        <section class="search-card">

            <div class="input-group">

                <input
                    id="urlInput"
                    type="url"
                    placeholder="Paste a media URL..."
                    autocomplete="off">

                <button id="pasteBtn">
                    📋 Paste
                </button>

                <button id="clearBtn">
                    ✕
                </button>

            </div>

            <button
                id="analyzeBtn"
                class="primary">

                Analyze Media

            </button>

        </section>

        <section
            id="loading"
            class="hidden">

            <div class="spinner"></div>

            <p>Analyzing video...</p>

        </section>

        <section
            id="resultCard"
            class="hidden">

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
                poster="">
            </video>

            <div class="video-info">

                <h2 id="videoTitle">
                    Title
                </h2>

                <p id="videoAuthor">
                    Author
                </p>

                <p id="mediaPlatform"></p>

                <p id="videoDuration">
                    Duration
                </p>

            </div>

            <div class="actions">

                <button
                    id="downloadVideoBtn"
                    class="primary">

                    Download Media

                </button>

                <button
                    id="downloadAudioBtn">

                    Extract Audio
                    <span class="coming-soon">
                        Soon
                    </span>

                </button>

                <button
                    id="resetBtn">

                    Reset

                </button>

            </div>

        </section>

    </main>

    <script type="module" src="./js/app.js"></script>

</body>

</html>
